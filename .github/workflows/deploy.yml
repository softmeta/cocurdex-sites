# Deploy the public static site (out/) to Cloudflare Pages.
name: Deploy

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build static site
        run: pnpm build

      # 密钥只注入真正调用 wrangler 的步骤。if 表达式读不到 secrets，所以是否跳过在这一步里判断。
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 分支名经环境变量传入，避免把 github 上下文拼进脚本。
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare deployment skipped because repository secrets are not configured."
            exit 0
          fi
          pnpm dlx wrangler@4.151.2 pages deploy out \
            --project-name=cocurdex-web \
            --branch="$DEPLOY_BRANCH" \
            --commit-dirty=true
